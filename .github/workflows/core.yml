name: Contract core
on: [push, pull_request]
jobs:
  pool-arithmetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show
      - run: npm ci
      - run: cargo test --locked -p openswap-pool-arithmetic
      - run: cargo check --locked -p openswap-pool-arithmetic --lib --target riscv64imac-unknown-none-elf
      - run: npm run test:pool-cross
      - run: npm run test:pool-wire
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned toolchain
        run: rustup show
      - name: Verify external fixtures
        run: python3 scripts/verify-fixtures.py
      - name: Formatting and lint
        run: make check
      - name: Build and execute CKB-VM tests
        run: make test
      - name: Build and execute isolated pool CKB-VM tests
        run: make pool-test
      - name: Match immutable testnet binary
        run: python3 scripts/check-contract-identity.py
      - name: Rebuild in independent target directories
        run: ./scripts/check-reproducible.sh
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:sdk
      - run: npm run test:pool-model
      - run: npm run test:pool-sdk
      - run: npm run build:smoke
      - run: npm run release:frontend
